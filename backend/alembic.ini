# Alembic configuration for the backend service.
#
# The database URL is NOT read from here at runtime: backend/alembic/env.py
# resolves it from the DATABASE_URL environment variable (see .env.example)
# and converts it to a synchronous SQLAlchemy URL (postgresql+psycopg://).
# The sqlalchemy.url below is only a fallback placeholder for offline use.
#
# Migrations are hand-written raw SQL via op.execute() — there is no ORM and
# no model metadata (target_metadata is None), so `alembic revision
# --autogenerate` is intentionally NOT used.

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
version_path_separator = os
# placeholder; env.py overrides this from DATABASE_URL
sqlalchemy.url = postgresql+psycopg://postgres:postgres@localhost:5432/backend

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
