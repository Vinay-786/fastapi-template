# Prod workflow: lint + mocked unit tests + production builds.
#
# No live database is required. Backend DB tests (marked `db`) are deselected
# with `-m "not db"`; only monkeypatched/fake-connection unit tests run here.
# The full suite (including Postgres integration tests) still runs locally via
# `make backend-test` with `make db-up`.
#
# Triggers on pushes to master and manually via "Run workflow".

name: prod

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: prod-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint:
    name: backend lint (ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: backend/.python-version

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check src tests alembic

  backend-unit-test:
    name: backend unit tests (mocked, no DB)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: backend/.python-version

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run mocked unit tests (deselect live-DB tests)
        run: uv run pytest -m "not db" -v

  frontend:
    name: frontend lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (oxlint)
        run: npm run lint

      - name: Type-check + build
        run: npm run build

  docker-build:
    name: production docker builds
    runs-on: ubuntu-latest
    needs: [backend-lint, backend-unit-test, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build all production images
        run: docker compose build

      - name: Verify compose config
        run: docker compose config --quiet
